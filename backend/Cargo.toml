[package]
name = "airslice"
version = "0.3.4"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
getrandom = "0.3"
hex = "0.4.3"
md-5 = "0.11.0"
libc = "0.2"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "cookies", "query", "charset", "http2", "system-proxy", "multipart"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
rustls = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zip = "9.1.0"
ring = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
